<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Replacement Visualizer | AlgoVisual Hub</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css?v=mobile_fix_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            /* Stats panel on right */
            gap: 30px;
            margin-top: 30px;
        }

        @media(max-width: 768px) {
            .visualizer-layout {
                grid-template-columns: 1fr;
            }
        }

        .frame-display {
            display: flex;
            gap: 15px;
            min-height: 200px;
            overflow-x: auto;
            padding: 20px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            align-items: flex-start;
        }

        .frame-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 60px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .reference-number {
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 1.2rem;
        }

        .frame-box {
            width: 50px;
            height: 50px;
            border: 2px solid var(--text);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin: 3px;
            background: var(--card-bg);
            color: var(--text);
            transition: all 0.3s;
        }

        .hit-miss-label {
            margin-top: 8px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            background: var(--card-bg);
            color: var(--text);
        }
    </style>

    <!-- AdSense Auto -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906580768177940"
     crossorigin="anonymous"></script>
    <link rel="icon" href="../assets/img/logo.png" type="image/png">
</head>

<body>
    <nav>
        <div class="container nav-content">
            <a href="../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../os.html">Back to OS</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block;">Memory
                Management</span>
            <h1>Page Replacement Visualizer</h1>
            <p>Compare <strong>FIFO</strong>, <strong>LRU</strong>, and <strong>Optimal</strong> page replacement
                algorithms.</p>
        </header>

        <div class="visualizer-layout">
            <div class="main-panel">
                <div class="glass-card" style="padding: 30px;">
                    <!-- Controls will be injected here by ui-extras or we can add manual placeholder if needed -->
                    <div class="controls" style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
                        <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Run</button>
                        <button class="btn btn-secondary"
                            onclick="shareScreenshot('visualizer-layout', 'Page Replacement')">📸 Share</button>
                        <!-- Standard buttons will be appended here -->
                    </div>

                    <div id="frame-display" class="frame-display">
                        <!-- Steps injected here -->
                        <div style="padding: 20px; color: #888;">Configure and run to see simulation.</div>
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <h3>Configuration</h3>
                    <div class="input-group">
                        <label>Algorithm</label>
                        <select id="algo-select">
                            <option value="FIFO">FIFO</option>
                            <option value="LRU">LRU</option>
                            <option value="Optimal">Optimal</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Frames</label>
                        <input type="number" id="frame-size" value="3" min="1" max="8">
                    </div>
                    <div class="input-group">
                        <label>Solve My Assignment (Reference String)</label>
                        <input type="text" id="ref-string" value="7,0,1,2,0,3,0,4,2,3,0,3,2">
                    </div>
                </div>

                <div class="glass-card" style="padding: 20px; margin-top: 20px;">
                    <h3>Stats</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Hits:</span>
                        <strong id="total-hits">0</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Faults:</span>
                        <strong id="total-faults">0</strong>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span>Hit Ratio:</span>
                        <strong id="hit-ratio">0%</strong>
                    </div>
                    <hr style="margin: 15px 0; opacity: 0.2;">
                    <div id="status-text" style="font-size: 0.9rem; font-style: italic;">
                        Ready.
                    </div>
                </div>
            </div>
        </div>

        <div style="margin: 60px 0; text-align: center;">
            <!-- Ad container handled by ui-extras -->
            
<div class="adsbygoogle-container" style="margin: 40px 0; text-align: center;">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906580768177940" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-6906580768177940"
         data-ad-slot="9009736994"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
        </div>
    </main>

    <script src="../assets/js/core/playback.js"></script>
    <script src="../assets/js/algos/page-replacement.js"></script>
    <script>
        const ui = {
            updateStatus: (t) => document.getElementById('status-text').innerText = t,
            updateStats: (hits, faults, total) => {
                document.getElementById('total-hits').innerText = hits;
                document.getElementById('total-faults').innerText = faults;
                const totalProcessed = hits + faults;
                const ratio = totalProcessed > 0 ? ((hits / totalProcessed) * 100).toFixed(1) : 0;
                document.getElementById('hit-ratio').innerText = ratio + "%";
            },
            clearDisplay: () => {
                document.getElementById('frame-display').innerHTML = '';
            },
            renderStep: (step, capacity) => {
                const display = document.getElementById('frame-display');

                // Build HTML for one step
                let html = `
                <div class="frame-step">
                    <div class="reference-number">${step.page}</div>`;

                // Frames
                for (let i = 0; i < capacity; i++) {
                    const val = step.frames[i] !== undefined ? step.frames[i] : '';
                    let style = '';
                    // Optional: Highlight newest or victim? simple for now
                    html += `<div class="frame-box" ${style}>${val}</div>`;
                }

                const color = step.hit ? '#4ade80' : '#f87171'; // Green : Red
                html += `<div class="hit-miss-label" style="color: ${color}">${step.hit ? 'HIT' : 'MISS'}</div>
                </div>`;

                // Append
                display.insertAdjacentHTML('beforeend', html);

                // Auto scroll
                display.scrollLeft = display.scrollWidth;
            }
        };

        const playback = new Playback(() => window.algo.nextStep());
        window.playback = playback; // Hook for Speed Slider

        window.algo = new PageReplacementAlgo(playback, ui);

        // Standard Play Button Logic
        document.getElementById('play-btn').onclick = () => {
            if (playback.isRunning) return; // Already running logic handled by playback control usually

            // If just starting
            if (window.algo.currentIndex === 0) {
                const type = document.getElementById('algo-select').value;
                const caps = parseInt(document.getElementById('frame-size').value);
                const refs = document.getElementById('ref-string').value;
                window.algo.init(type, caps, refs);
            }

            playback.play();
        };

    </script>
    <script src='../assets/js/core/ui-extras.js'></script>
</body>

</html>
