<div class="adsbygoogle-container" style="margin: 40px 0; text-align: center;">

    <script src="../assets/js/core/algo-content.js"></script>

    <script>

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const visualizerContainer = document.getElementById('visualizer-container');
                if (visualizerContainer) {
                    visualizerContainer.innerHTML = `
                        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px;">
                            <canvas id="graph-canvas" width="500" height="400" style="border: 1px solid var(--border); border-radius: 8px;"></canvas>
                            <div class="glass-card" style="padding: 20px;">
                                <h4>Distance Table</h4>
                                <div id="distance-table" style="font-family: monospace; font-size: 0.9rem; line-height: 1.6;">
                                    <div>A: 0</div>
                                    <div>B: ∞</div>
                                    <div>C: ∞</div>
                                    <div>D: ∞</div>
                                </div>
                            </div>
                        </div>
                        <div style="margin-top: 20px; display: flex; justify-content: center; gap: 12px;">
                            <button class="btn btn-primary" onclick="startDijkstra()">Start Dijkstra</button>
                            <button class="btn btn-secondary" onclick="resetDijkstra()">Reset</button>
                            <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'Dijkstra')">📸 Share</button>
                        </div>
                    `;
                    logStep('Dijkstra visualizer initialized', 'info');
                }
            }, 100);
        });

        function startDijkstra() {
            logStep('Starting Dijkstra from vertex A', 'info');
            logStep('Initializing distances: A=0, others=∞', 'info');
        }

        function resetDijkstra() {
            logStep('Reset complete - ready for new run', 'info');
        }
    </script>
</body>
