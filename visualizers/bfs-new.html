    <script>


        // Initialize BFS visualizer after UI is loaded
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const visualizerContainer = document.getElementById('visualizer-container');
                if (visualizerContainer) {
                    visualizerContainer.innerHTML = `
                        <canvas id="graph-canvas" width="600" height="400" style="border: 1px solid var(--border); border-radius: 8px; width: 100%;"></canvas>
                        <div style="margin-top: 20px; display: flex; justify-content: center; gap: 12px;">
                            <button class="btn btn-primary" onclick="startBFS()">Start BFS</button>
                            <button class="btn btn-secondary" onclick="stepBFS()" id="step-btn" disabled>Step</button>
                            <button class="btn btn-secondary" onclick="resetBFS()">Reset</button>
                            <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'BFS')">📸 Share</button>
                        </div>
                    `;

                    // Initialize graph engine and BFS
                    window.graphEngine = new GraphEngine('graph-canvas');
                    initializeBFS();
                }
            }, 100);
        });

        function initializeBFS() {
            // Sample graph data
            const nodes = [
                { id: 'A', x: 100, y: 100 },
                { id: 'B', x: 300, y: 100 },
                { id: 'C', x: 500, y: 100 },
                { id: 'D', x: 200, y: 250 },
                { id: 'E', x: 400, y: 250 }
            ];

            const edges = [
                { from: 'A', to: 'B' },
                { from: 'A', to: 'D' },
                { from: 'B', to: 'C' },
                { from: 'B', to: 'E' },
                { from: 'D', to: 'E' }
            ];

            window.graphEngine.setNodes(nodes);
            window.graphEngine.setEdges(edges);
            window.graphEngine.draw();

            logStep('Graph initialized with 5 nodes and 5 edges', 'info');
        }

        function startBFS() {
            logStep('Starting BFS from node A', 'info');
            document.getElementById('step-btn').disabled = false;
            // BFS implementation would go here
        }

        function stepBFS() {
            logStep('Executing BFS step...', 'success');
            // Step implementation would go here
        }

        function resetBFS() {
            logStep('Resetting visualization', 'info');
            document.getElementById('step-btn').disabled = true;
            if (window.graphEngine) {
                window.graphEngine.draw();
            }
        }
    </script>
