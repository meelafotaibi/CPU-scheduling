<!DOCTYPE html>
<html lang="en" data-theme="light" data-algo="astar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A* Search Visualizer - AlgoVisual Hub</title>
    <meta name="description" content="Interactive A* search algorithm visualization with heuristic pathfinding.">
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <nav>
        <div class="container">
            <div class="nav-content">
                <a href="../index.html" class="logo">AlgoVisual Hub</a>
                <div class="nav-links">
                    <a href="../algorithms.html">Algorithms</a>

                </div>
            </div>
        </div>
    </nav>

    <main></main>

    <script src="../assets/js/core/complete-algo-content.js"></script>
    <script src="../assets/js/core/ui-extras.js"></script>
    <script>


        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const visualizerContainer = document.getElementById('visualizer-container');
                if (visualizerContainer) {
                    visualizerContainer.innerHTML = `
                        <div style="display: grid; grid-template-columns: 1fr 300px; gap: 20px;">
                            <div id="grid-container" style="display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; height: 400px; border: 1px solid var(--border); border-radius: 8px; padding: 10px;"></div>
                            <div class="glass-card" style="padding: 20px;">
                                <h4>A* Pathfinding</h4>
                                <div style="margin-bottom: 16px;">
                                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                        <div style="width: 20px; height: 20px; background: var(--success); border-radius: 4px;"></div>
                                        <span style="font-size: 0.9rem;">Start</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                        <div style="width: 20px; height: 20px; background: var(--accent); border-radius: 4px;"></div>
                                        <span style="font-size: 0.9rem;">Goal</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                                        <div style="width: 20px; height: 20px; background: #333; border-radius: 4px;"></div>
                                        <span style="font-size: 0.9rem;">Wall</span>
                                    </div>
                                    <div style="display: flex; align-items: center; gap: 8px;">
                                        <div style="width: 20px; height: 20px; background: var(--warning); border-radius: 4px;"></div>
                                        <span style="font-size: 0.9rem;">Path</span>
                                    </div>
                                </div>
                                <button class="btn btn-primary" onclick="startAStar()" style="width: 100%; margin-bottom: 8px;">Find Path</button>
                                <button class="btn btn-secondary" onclick="resetAStar()">Reset</button>
                                <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'A* Search')">📸 Share</button>
                            </div>
                        </div>
                    `;
                    initializeGrid();
                    logStep('A* pathfinding visualizer ready', 'info');
                }
            }, 100);
        });

        let grid = [];
        let start = { x: 1, y: 1 };
        let goal = { x: 8, y: 8 };

        function initializeGrid() {
            const container = document.getElementById('grid-container');
            grid = Array(10).fill().map(() => Array(10).fill(0));

            // Add some walls
            [[2, 2], [2, 3], [2, 4], [5, 5], [5, 6], [6, 5], [6, 6]].forEach(([x, y]) => {
                grid[y][x] = 1;
            });

            container.innerHTML = '';
            for (let y = 0; y < 10; y++) {
                for (let x = 0; x < 10; x++) {
                    const cell = document.createElement('div');
                    cell.style.cssText = `
                        background: ${getCellColor(x, y)};
                        border-radius: 4px;
                        cursor: pointer;
                        transition: all 0.2s ease;
                    `;
                    cell.onclick = () => toggleWall(x, y);
                    container.appendChild(cell);
                }
            }
        }

        function getCellColor(x, y) {
            if (x === start.x && y === start.y) return 'var(--success)';
            if (x === goal.x && y === goal.y) return 'var(--accent)';
            if (grid[y][x] === 1) return '#333';
            return '#f0f0f0';
        }

        function toggleWall(x, y) {
            if ((x === start.x && y === start.y) || (x === goal.x && y === goal.y)) return;
            grid[y][x] = grid[y][x] === 1 ? 0 : 1;
            initializeGrid();
        }

        function startAStar() {
            logStep('Starting A* pathfinding algorithm', 'info');
            logStep(`Finding path from (${start.x},${start.y}) to (${goal.x},${goal.y})`, 'info');

            // Simple A* simulation
            setTimeout(() => {
                logStep('Calculating heuristic distances...', 'info');
                setTimeout(() => {
                    logStep('Exploring nodes with lowest f-cost...', 'warning');
                    setTimeout(() => {
                        logStep('Path found! Optimal route calculated.', 'success');
                        highlightPath();
                    }, 1000);
                }, 800);
            }, 500);
        }

        function highlightPath() {
            const container = document.getElementById('grid-container');
            const cells = container.children;

            // Simple path from start to goal
            const path = [
                [1, 1], [2, 1], [3, 1], [4, 1], [4, 2], [4, 3], [4, 4],
                [5, 4], [6, 4], [7, 4], [7, 5], [7, 6], [7, 7], [8, 8]
            ];

            path.forEach(([x, y], index) => {
                if ((x === start.x && y === start.y) || (x === goal.x && y === goal.y)) return;
                setTimeout(() => {
                    const cellIndex = y * 10 + x;
                    if (cells[cellIndex]) {
                        cells[cellIndex].style.background = 'var(--warning)';
                    }
                }, index * 100);
            });
        }

        function clearGrid() {
            grid = Array(10).fill().map(() => Array(10).fill(0));
            initializeGrid();
            logStep('Grid cleared', 'info');
        }
    </script>
</body>

</html>
