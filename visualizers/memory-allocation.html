            background: rgba(15, 23, 42, 0.95) !important;
        }

        [data-theme="dark"] input,
        [data-theme="dark"] select {
            background: rgba(15, 23, 42, 0.8) !important;
            color: #f1f5f9 !important;

    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-top: 30px;
        }

        #memory-canvas {
            width: 100%;
            height: 300px;

            border: 2px solid #eee;
            border-radius: 12px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .process-list {
            list-style: none;
            margin-top: 15px;
        }

        .process-item {
            padding: 10px;
            /* background: #f8f9fa; removed */
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 10px;
            font-weight: bold;
        }

        .status-allocated {
            background: #d4edda;
            color: #155724;
        }

        .status-waiting {
            background: #fff3cd;
            color: #856404;
        }

        .status-fail {
            background: #f8d7da;
            color: #721c24;
        }
    </style>

<body>

    <nav>
        <div class="container nav-content">
            <a href="../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../os.html">Back to OS</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block;">Memory
                Management</span>
            <h1>Memory Allocation Visualizer</h1>
            <p>Visualize how the OS allocates memory to processes using <strong>First Fit</strong>, <strong>Best
                    Fit</strong>, and <strong>Worst Fit</strong> strategies.</p>
        </header>

        <div class="visualizer-layout">
            <div class="glass-card" id="visualizer-container" style="padding: 30px;">
                <canvas id="memory-canvas"></canvas>

                <div style="margin-top: 30px;">
                    <div style="display: flex; gap: 15px; align-items: center; margin-bottom: 20px;">
                        <label>Allocation Strategy:</label>
                        <select id="strategy-select" class="btn" style="background: white; border: 1px solid #ddd;">
                            <option value="first">First Fit</option>
                            <option value="best">Best Fit</option>
                            <option value="worst">Worst Fit</option>
                        </select>
                        <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Run
                            Allocation</button>
                        <button class="btn" id="reset-btn"
                            style="border: 1px solid var(--accent); color: var(--accent);"><i class="fas fa-undo"></i>
                            Reset</button>
                        <button class="btn btn-secondary"
                            onclick="shareScreenshot('visualizer-container', 'Memory Allocation')">📸 Share</button>
                    </div>

                    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                        <button class="btn" onclick="addProcess()" style="background: var(--dark); color: white;">+ Add
                            Process</button>
                    </div>

                    <h4>Partitions (Memory Blocks)</h4>
                    <div id="partition-container"
                        style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px;">
                        <!-- Injected JS -->
                    </div>
                    <button class="btn" onclick="addPartition()"
                        style="background: var(--secondary); color: white; padding: 5px 10px; font-size: 0.8rem;">+ Add
                        Block</button>
                </div>
            </div>

            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <h4>📜 Allocation Log</h4>
                    <p id="explanation-text" style="font-size: 0.85rem; margin-top: 10px; min-height: 50px;">Ready to
                        allocate memory.</p>
                </div>

                <div class="glass-card" style="padding: 20px;">
                    <h4>📊 Processes (Jobs)</h4>
                    <ul class="process-list" id="process-list"></ul>
                </div>
            </div>
        </div>

        <!-- Ad Slot handled by ui-extras -->

    <script src="../assets/js/core/memory-engine.js"></script>
    <script>
        const engine = new MemoryEngine('memory-canvas');
        let processes = [
            { id: 1, size: 212, status: 'waiting' },
            { id: 2, size: 417, status: 'waiting' },
            { id: 3, size: 112, status: 'waiting' },
            { id: 4, size: 426, status: 'waiting' }
        ];
        let partitions = [100, 500, 200, 300, 600];

        function updateUI() {
            const list = document.getElementById('process-list');
            list.innerHTML = processes.map((p, index) => `
                <li class="process-item">
                    <span>Process ${p.id} (${p.size}K)</span>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <span class="status-badge status-${p.status}">${p.status.toUpperCase()}</span>
                        <button onclick="deleteProcess(${index})" style="background: none; border: none; color: #ef4444; cursor: pointer;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </li>
            `).join('');
        }

        function addProcess() {
            const size = prompt("Enter process size (K):", "150");
            if (size) {
                processes.push({ id: processes.length + 1, size: parseInt(size), status: 'waiting' });
                updateUI();
            }
        }

        function deleteProcess(index) {
            processes.splice(index, 1);
            updateUI();
        }

        function renderPartitions() {
            const container = document.getElementById('partition-container');
            container.innerHTML = partitions.map((size, i) => `
                <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
                    <input type="number" value="${size}" onchange="updatePartition(${i}, this.value)" style="width: 60px; padding: 5px; border: 1px solid #ddd; border-radius: 5px; text-align: center;">
                    <button onclick="removePartition(${i})" style="border: none; background: none; color: #aaa; cursor: pointer; font-size: 0.8rem;">&times;</button>
                </div>
            `).join('');
            engine.setBlocks(partitions);
        }

        function updatePartition(index, value) {
            const val = parseInt(value);
            if (!isNaN(val) && val > 0) {
                partitions[index] = val;
                engine.setBlocks(partitions);
                resetAll();
            }
        }

        function addPartition() {
            partitions.push(200); // Default new block
            renderPartitions();
            resetAll();
        }

        function removePartition(index) {
            if (partitions.length > 1) {
                partitions.splice(index, 1);
                renderPartitions();
                resetAll();
            }
        }

        function resetAll() {
            engine.reset();
            processes.forEach(p => p.status = 'waiting');
            updateUI();
            document.getElementById('explanation-text').innerText = "Memory reset.";
        }

        async function runAllocation() {
            resetAll();
            const strategy = document.getElementById('strategy-select').value;
            document.getElementById('explanation-text').innerText = `Running ${strategy} fit allocation...`;

            for (let p of processes) {
                let bestIdx = -1;

                if (strategy === 'first') {
                    for (let i = 0; i < engine.blocks.length; i++) {
                        if (engine.blocks[i].free && engine.blocks[i].size >= p.size) {
                            bestIdx = i;
                            break;
                        }
                    }
                } else if (strategy === 'best') {
                    let minGap = Infinity;
                    for (let i = 0; i < engine.blocks.length; i++) {
                        if (engine.blocks[i].free && engine.blocks[i].size >= p.size) {
                            let gap = engine.blocks[i].size - p.size;
                            if (gap < minGap) {
                                minGap = gap;
                                bestIdx = i;
                            }
                        }
                    }
                } else if (strategy === 'worst') {
                    let maxGap = -1;
                    for (let i = 0; i < engine.blocks.length; i++) {
                        if (engine.blocks[i].free && engine.blocks[i].size >= p.size) {
                            let gap = engine.blocks[i].size - p.size;
                            if (gap > maxGap) {
                                maxGap = gap;
                                bestIdx = i;
                            }
                        }
                    }
                }

                if (bestIdx !== -1) {
                    engine.allocate(bestIdx, p.id, p.size);
                    p.status = 'allocated';
                } else {
                    p.status = 'fail';
                }
                updateUI();
                await new Promise(r => setTimeout(r, 600));
            }
            document.getElementById('explanation-text').innerText = "Allocation sequence complete.";
        }

        document.getElementById('play-btn').onclick = runAllocation;
        document.getElementById('reset-btn').onclick = resetAll;

        window.onload = () => {
            renderPartitions();
            // engine.setBlocks(partitions); // Called inside renderPartitions
            updateUI();
            setTimeout(() => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { } }, 1000);
        };
    </script>

    <script src="../assets/js/core/algo-content.js"></script>
    <script src='../assets/js/core/ui-extras.js'></script>
</body>

</html>
