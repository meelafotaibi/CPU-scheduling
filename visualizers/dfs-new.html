<head>
    <meta charset="UTF-8">

    <meta name="description" content="Interactive Depth-First Search visualization with step-by-step execution.">

<body><canvas id="brain-canvas"></canvas>
    <nav>
        <div class="container">
            <div class="nav-content">
                <a href="../index.html" class="logo">AlgoVisual Hub</a>
                <div class="nav-links">
                    <a href="../algorithms.html">Algorithms</a>
                    <a href="../dsa.html">DSA</a>

                </div>

        </div>

    <main>

</main>

    <script src="../assets/js/core/algo-content.js"></script>
    <script src="../assets/js/core/dfs-content.js"></script>
    <script src="../assets/js/core/ui-extras.js"></script>
    <script>

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const visualizerContainer = document.getElementById('visualizer-container');
                if (visualizerContainer) {
                    visualizerContainer.innerHTML = `
                        <canvas id="graph-canvas" width="600" height="400" style="border: 1px solid var(--border); border-radius: 8px; width: 100%;"></canvas>
                        <div style="margin-top: 20px; display: flex; justify-content: center; gap: 12px;">
                            <button class="btn btn-primary" onclick="startDFS()">Start DFS</button>
                            <button class="btn btn-secondary" onclick="resetDFS()">Reset</button>
                            <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'DFS')">📸 Share</button>
                        </div>
                    `;
                    logStep('DFS visualizer ready', 'info');
                }
            }, 100);
        });

        function startDFS() {
            logStep('Starting DFS traversal...', 'info');
        }

        function resetDFS() {
            logStep('Reset complete', 'info');
        }
    </script>
<script src="../assets/js/brain-animation.js"></script></body>
