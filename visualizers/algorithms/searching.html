<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searching Visualizer | AlgoVisual Hub</title>
    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css?v=mobile_fix_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-top: 30px;
        }

        #array-canvas {
            width: 100%;
            height: 400px;
            border: 2px solid var(--glass-border);
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 20px;
        }

        .mode-toggle {
            display: flex;
            /* background: #f1f3f5; removed */
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .mode-btn {
            flex: 1;
            padding: 8px;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .mode-btn.active {
            background: rgba(99,102,241,0.2);
            box-shadow: 0 0 12px rgba(99,102,241,0.3);
            color: var(--primary);
        }
    </style>
    <link rel="icon" href="../../assets/img/logo.png" type="image/png">
</head>

<body><canvas id="brain-canvas"></canvas>

    <nav>
        <div class="container nav-content">
            <a href="../../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../../index.html">Home</a>
                <a href="../../algorithms.html">Back to Algorithms</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block;">Searching
                Algorithms</span>
            <h1>Searching Visualizer</h1>
            <p>Find elements in an array using different search strategies.</p>
        </header>

        <div class="visualizer-layout">
            <div class="glass-card" id="visualizer-container" style="padding: 30px;">
                <div class="mode-toggle">
                    <button class="mode-btn active" id="linear-mode">Linear Search</button>
                    <button class="mode-btn" id="binary-mode">Binary Search</button>
                </div>

                <canvas id="array-canvas"></canvas>

                <div style="margin-top: 25px; display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Search</button>
                        <button class="btn" id="next-btn" style="background: var(--dark); color: white;">Next
                            Step</button>
                        <button class="btn" id="reset-btn"
                            style="border: 1px solid var(--accent); color: var(--accent);">Reset</button>
                        <button class="btn btn-secondary"
                            onclick="shareScreenshot('visualizer-container', 'Searching')">📸 Share</button>
                    </div>
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <label>Target:</label>
                        <input type="number" id="target-val" value="25"
                            style="width: 70px; padding: 8px; border-radius: 8px; border: 1px solid #ddd;">
                    </div>
                </div>
            </div>

            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <h4>📜 Execution Log</h4>
                    <p id="explanation-text" style="font-size: 0.85rem; margin-top: 10px; min-height: 50px;">Set a
                        target and click Search.</p>
                </div>

                <div class="glass-card" style="padding: 20px;">
                    <h4>🛠️ Array Controls</h4>
                    <button class="btn" id="random-btn"
                        style="width: 100%; border: 1px solid #ddd; margin-bottom: 10px;">Random Data</button>
                    <button class="btn" onclick="showModal('input-modal')"
                        style="width: 100%; background: var(--secondary); color: white; margin-bottom: 10px;"><i
                            class="fas fa-edit"></i> Solve My Assignment</button>
                    <button class="btn" id="sort-btn"
                        style="width: 100%; /* background: #f8f9fa; removed */ border: 1px solid #ddd;">Sort Array
                        (Required for
                        Binary)</button>
                </div>
            </div>
        </div>

        <div style="margin: 60px 0; text-align: center;">
            
        </div>
    </main>

    <script src="../../assets/js/core/array-engine.js"></script>
    <script src="../../assets/js/core/playback.js"></script>
    <script src="../../assets/js/core/ComplexityTracker.js"></script>
    <script src="../../../assets/js/core/ui-extras.js"></script>
    <script src="../../assets/js/algos/algorithms/linear-search.js"></script>
    <script src="../../assets/js/algos/algorithms/binary-search.js"></script>
    <script>
        window.engine = new ArrayEngine('array-canvas');
        window.ui = {
            updateStatus: (t) => document.getElementById('explanation-text').innerText = t,
            updateStats: () => { }
        };
        const ui = window.ui;
        const playback = new Playback(() => window.algo.nextStep());

        window.algo = new LinearSearchAlgo(window.engine, playback, ui);
        let mode = 'linear';

        function initArray(sorted = false) {
            const arr = [];
            for (let i = 0; i < 15; i++) arr.push(Math.floor(Math.random() * 90) + 10);
            if (sorted) arr.sort((a, b) => a - b);
            window.engine.setArray(arr);
            window.algo.reset();
        }

        document.getElementById('linear-mode').onclick = () => {
            mode = 'linear';
            document.getElementById('linear-mode').classList.add('active');
            document.getElementById('binary-mode').classList.remove('active');
            window.algo = new LinearSearchAlgo(window.engine, playback, ui);
            window.algo.reset();
            if (window.complexityTracker) window.complexityTracker.setComplexity("O(n)", "O(1)");
        };

        document.getElementById('binary-mode').onclick = () => {
            mode = 'binary';
            document.getElementById('binary-mode').classList.add('active');
            document.getElementById('linear-mode').classList.remove('active');
            window.algo = new BinarySearchAlgo(window.engine, playback, ui);
            window.algo.reset();
            if (window.complexityTracker) window.complexityTracker.setComplexity("O(log n)", "O(1)");
        };

        document.getElementById('play-btn').onclick = () => {
            const target = parseInt(document.getElementById('target-val').value);
            window.algo.setTarget(target);
            playback.play();
        };

        document.getElementById('next-btn').onclick = () => {
            const target = parseInt(document.getElementById('target-val').value);
            if (window.algo.target === null) window.algo.setTarget(target);
            window.algo.nextStep();
        };

        document.getElementById('reset-btn').onclick = () => {
            playback.stop();
            window.algo.reset();
            if (window.complexityTracker) window.complexityTracker.reset();
        };

        document.getElementById('random-btn').onclick = () => {
            playback.stop();
            initArray(mode === 'binary');
        };

        document.getElementById('sort-btn').onclick = () => {
            const sorted = [...window.engine.array].sort((a, b) => a - b);
            window.engine.setArray(sorted);
            window.algo.reset();
        };

        window.onload = () => {
            initArray(false);
            if (window.complexityTracker) window.complexityTracker.setComplexity("O(n)", "O(1)");
        };
    </script>
<script src="../../assets/js/brain-animation.js"></script></body>


</html>
