<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Search Visualizer | AlgoVisual Hub</title>
    <meta name="description"
        content="Compare BFS, DFS, UCS, Greedy Best-First, and A* Search algorithms visually. Understand graph traversal and pathfinding.">

    <!-- Open Graph -->
    <meta property="og:title" content="AI Search Visualizers - BFS, DFS, A* | AlgoVisual Hub">
    <meta property="og:description"
        content="Interactive visualization of Graph Search algorithms including BFS, DFS, and A*.">

    <link rel="stylesheet" href="../../assets/css/main.css">
    <link rel="stylesheet" href="../../assets/css/responsive.css?v=mobile_fix_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-top: 30px;
        }

        #graph-canvas {
            width: 100%;
            height: 500px;
            border: 2px solid #eee;
            border-radius: 12px;
            cursor: crosshair;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .algo-selector {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--text);
        }

        .pq-list {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-family: monospace;
        }

        .pq-item {
            display: flex;
            justify-content: space-between;
            padding: 4px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }
    </style>
    <link rel="icon" href="../../assets/img/logo.png" type="image/png">
</head>

<body><canvas id="brain-canvas"></canvas>
    <nav>
        <div class="container nav-content">
            <a href="../../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../../index.html">Home</a>
                <a href="../../ai.html">Back to AI</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 15px;">AI
                Search</span>
            <h1>Search Algorithms</h1>
            <p>Compare how different search strategies (BFS, DFS, UCS, Greedy, A*) traverse a graph to find a goal.</p>
        </header>

        <div class="visualizer-layout">
            <div class="glass-card" id="visualizer-container" style="padding: 30px;">
                <canvas id="graph-canvas"></canvas>

                <div style="margin-top: 25px; display: flex; align-items: center; gap: 15px;">
                    <!-- Controls injected by ui-extras -->
                    <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Run</button>
                    <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'AI Search')">📸
                        Share</button>
                </div>
                <p style="font-size: 0.8rem; color: #666; margin-top: 10px;">
                    Shift+Click to set Goal (Star). Default Start is Node 0 (Green).
                </p>
            </div>

            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <label
                        style="display:block; margin-bottom: 5px; font-size: 0.9rem; font-weight: 600;">Algorithm</label>
                    <select id="algo-select" class="algo-selector" onchange="changeAlgo()">
                        <option value="bfs">BFS (Breadth-First Search)</option>
                        <option value="dfs">DFS (Depth-First Search)</option>
                        <option value="ucs">UCS (Uniform Cost Search)</option>
                        <option value="greedy">Greedy Best-First Search</option>
                        <option value="astar">A* Search</option>
                    </select>

                    <div id="explanation-text" style="color: #666; font-style: italic; min-height: 40px;">
                        Select an algorithm to begin.
                    </div>
                </div>

                <div class="glass-card" style="padding: 20px;">
                    <h4>Frontier / Priority Queue</h4>
                    <div id="pq-list" class="pq-list">
                        <div style="text-align:center; color:#999;">Empty</div>
                    </div>
                </div>
            </div>
        </div>

        <div style="margin: 60px 0; text-align: center;">
            
        </div>
    </main>

    <script src="../../assets/js/core/graph-engine.js"></script>
    <script src="../../assets/js/core/playback.js"></script>

    <!-- We can reuse existing Algo files if we construct them dynamically -->
    <script src="../../assets/js/algos/algorithms/bfs.js"></script>
    <script src="../../assets/js/algos/algorithms/dfs.js"></script>
    <script src="../../assets/js/algos/algorithms/dijkstra.js"></script> <!-- UCS is Dijkstra -->
    <script src="../../assets/js/algos/algorithms/astar.js"></script>

    <!-- Greedy needs a separate class or flag in A* -->
    <script>
        // Greedy Custom Wrapper or extension can go here or in a separate file
        // For simplicity, we'll verify if A* can handle h(n) only (pure heuristic)
        // Usually A* is f = g + h. Greedy is f = h.
    </script>

    <script>
        window.engine = new GraphEngine('graph-canvas', { isDirected: true });
        window.engine.setEditMode(true);

        const ui = {
            updateStatus: (t) => document.getElementById('explanation-text').innerText = t,
            updatePQ: (list) => {
                const container = document.getElementById('pq-list');
                if (!list || list.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:#999;">Empty</div>';
                    return;
                }
                // Handle different list formats (BFS array vs PQ)
                container.innerHTML = list.map(item => {
                    // Start of display logic
                    let label = "";
                    if (typeof item === 'object') {
                        label = `${item.id || item.to} (f=${(item.f || item.priority || 0).toFixed(1)})`;
                    } else {
                        label = item;
                    }
                    return `<div class="pq-item">${label}</div>`;
                }).join('');
            }
        };

        const playback = new Playback(async () => {
            // Dispatch to current algo
            if (window.algo) await window.algo.nextStep();
        });
        window.playback = playback;

        let currentAlgoType = 'bfs';

        function changeAlgo() {
            currentAlgoType = document.getElementById('algo-select').value;
            resetAlgo();
        }

        function resetAlgo() {
            playback.stop();
            window.engine.clearHighlights();

            const startNode = window.engine.nodes.keys().next().value || 0;
            // Note: Goal node handling needs to be robust. GraphEngine might not have explicit goal marking in core yet,
            // but A* usually assumes last node or specific node. 
            // For this MVP, we assume a goal or let the user click. 
            // GraphEngine doesn't have native "goal" property on nodes unless we add it.
            // visualizers/astar.html handles this via start/goal prompts or defaults.

            // Re-instantiate based on type
            switch (currentAlgoType) {
                case 'bfs':
                    window.algo = new BFSAlgo(window.engine, playback, ui);
                    break;
                case 'dfs':
                    window.algo = new DFSAlgo(window.engine, playback, ui);
                    break;
                case 'ucs':
                    // UCS is Dijkstra with 0 heuristic (or just Dijkstra)
                    window.algo = new DijkstraAlgo(window.engine, playback, ui);
                    break;
                case 'astar':
                    window.algo = new AStarAlgo(window.engine, playback, ui);
                    break;
                case 'greedy':
                    // Temp: Use A* but override cost to 0? Or separate file?
                    // Let's rely on A* implementation having param for weight multiplier?
                    // If A* is robust, we can inject a custom heuristic config.
                    window.algo = new AStarAlgo(window.engine, playback, ui);
                    // Just a placeholder for now
                    ui.updateStatus("Greedy Best-First: Uses h(n) only. (Mode mapped to A* for now)");
                    break;
            }
        }

        // Standardize Buttons will hook up #play-btn to start()
        // We need to define window.algo.start if standard buttons call it?
        // Actually standard buttons call playback.play(). 
        // We need a manual "Start" triggering the algo init if specific start nodes are needed.

        // This unified page needs a "Run" wrapper
        window.startSearch = () => {
            // Reset and init
            if (window.engine.nodes.size === 0) return alert("Add nodes first.");
            resetAlgo();

            // Pick start/goal
            let start = 1;
            if (window.engine.nodes.has(0)) start = 0; // Prefer 0
            // ...

            if (window.algo.start) window.algo.start(start);
            playback.play();
        };

        // Hook Play button via DOM or let ui-extras handle it if it calls specific ID
        // ui-extras checks for #play-btn. 
        // We need to ensure #play-btn calls window.startSearch or similar.

        // Post-load setup
        setTimeout(() => {
            const playBtn = document.getElementById('play-btn');
            if (playBtn) playBtn.onclick = window.startSearch;
        }, 500);

        changeAlgo(); // Init default
    </script>
    <script src='../../assets/js/core/ui-extras.js'></script>
<script src="../../assets/js/brain-animation.js"></script></body>

</html>
