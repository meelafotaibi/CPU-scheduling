<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack & Queue Visualizer | AlgoVisual Hub</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        #dsa-canvas {
            width: 100%;
            height: 400px;
            /* background: #fff; removed */
            border: 2px solid #eee;
            border-radius: 12px;
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            align-items: center;
        }

        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 80px;
        }

        .mode-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .active-btn {
            background: var(--primary) !important;
            color: white !important;
        }
    </style>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906580768177940"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav>
        <div class="container nav-content">
            <a href="../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../dsa.html">Back to DSA</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; display: inline-block; margin-bottom: 10px;">Linear
                DS</span>
            <h1>Stack & Queue Visualizer</h1>
            <p>Toggle between Stack (LIFO) and Queue (FIFO) to see how elements are managed.</p>
        </header>

        <div class="glass-card" id="visualizer-container" style="padding: 30px; margin-top: 30px;">
            <div class="mode-toggle">
                <button id="stack-btn" class="btn active-btn" onclick="setMode('stack')">Stack Mode</button>
                <button id="queue-btn" class="btn" onclick="setMode('queue')"
                    style="/* background: #eee; removed */">Queue
                    Mode</button>
            </div>
            <canvas id="dsa-canvas"></canvas>
            <div class="controls">
                <input type="number" id="node-val" placeholder="Val" value="10">
                <button class="btn btn-primary" id="push-btn" onclick="push()">Push</button>
                <button class="btn" id="pop-btn" onclick="pop()"
                    style="border: 1px solid var(--accent); color: var(--accent);">Pop</button>
                <button class="btn btn-secondary" onclick="shareScreenshot('visualizer-container', 'Stack/Queue')">📸
                    Share</button>
            </div>
        </div>

        <div style="margin: 60px 0; text-align: center;">
            <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-6906580768177940"
                data-ad-slot="1234567890" data-ad-format="auto" data-full-width-responsive="true"></ins>
            <script>window.onload = () => { setTimeout(() => { try { (adsbygoogle = window.adsbygoogle || []).push({}); } catch (e) { } }, 1000); };</script>
        </div>
    </main>

    <footer>
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2025 AlgoVisual Hub — Created with ❤️ by Meelo</p>
            </div>
        </div>
    </footer>

    <script src="../assets/js/core/dsa-engine.js"></script>
    <script src="../assets/js/algos/stack-queue.js"></script>
    <script>
        const engine = new DSAEngine('dsa-canvas');
        let current = new StackQueueAlgo(engine, 'stack');

        engine.draw = () => current.draw();

        function setMode(mode) {
            current = new StackQueueAlgo(engine, mode);
            document.getElementById('stack-btn').className = mode === 'stack' ? 'btn active-btn' : 'btn';
            document.getElementById('stack-btn').style.background = mode === 'stack' ? '' : '#eee';
            document.getElementById('queue-btn').className = mode === 'queue' ? 'btn active-btn' : 'btn';
            document.getElementById('queue-btn').style.background = mode === 'queue' ? '' : '#eee';

            document.getElementById('push-btn').innerText = mode === 'stack' ? 'Push' : 'Enqueue';
            document.getElementById('pop-btn').innerText = mode === 'stack' ? 'Pop' : 'Dequeue';
            engine.draw();
        }

        function push() {
            const val = document.getElementById('node-val').value || Math.floor(Math.random() * 100);
            current.push(val);
        }

        function pop() {
            current.pop();
        }

        window.onload = () => {
            current.push(10);
            current.push(20);
        };
    </script>

    <script src='../assets/js/core/ui-extras.js'></script>
</body>

</html>
