<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Sort Visualizer | AlgoVisual Hub</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css?v=mobile_fix_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-top: 30px;
        }

        #array-canvas {
            width: 100%;
            height: 400px;

            border: 2px solid #eee;
            border-radius: 12px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .stat-box {
            /* background: #f8f9fa; removed */
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #eee;
        }

        .stat-box h3 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 5px;
        }

        .stat-box span {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
        }
    </style>
    <!-- Ads handled centrally -->

    <!-- AdSense Auto -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906580768177940"
     crossorigin="anonymous"></script>
    <link rel="icon" href="../assets/img/logo.png" type="image/png">
</head>

<body>
    <nav>
        <div class="container nav-content">
            <a href="../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../algorithms.html">Back to Algorithms</a>
            </div>
        </div>
    </nav>
    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block;">Sorting</span>
            <h1>Merge Sort Visualizer</h1>
            <p>Merge sort is an efficient, stable, comparison-based sorting algorithm. It uses a divide-and-conquer
                strategy.</p>
        </header>
        <div class="visualizer-layout">
            <div class="glass-card" style="padding: 30px;">
                <canvas id="array-canvas"></canvas>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 25px;">
                    <div style="display: flex; gap: 10px;">
                        <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Play</button>
                        <button class="btn" id="reset-btn"
                            style="border: 1px solid var(--accent); color: var(--accent);"><i class="fas fa-undo"></i>
                            Reset</button>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <button class="btn" onclick="generateRandomArray()"
                            style="background: var(--dark); color: white;">🎲 Random Array</button>
                    </div>
                </div>
            </div>
            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <h4>📜 Live Log</h4>
                    <p id="explanation-text" style="font-size: 0.85rem; margin-top: 10px; min-height: 50px;">Ready.</p>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <h3 id="comp-count">0</h3><span>Comparisons</span>
                        </div>
                        <div class="stat-box">
                            <h3 id="swap-count">0</h3><span>Assignments</span>
                        </div>
                    </div>
                </div>
                <div class="glass-card" style="padding: 20px;">
                    <h4>💡 Complexity</h4>
                    <div style="font-size: 0.85rem; margin-top: 10px;">
                        <p><strong>Time:</strong> O(n log n)</p>
                        <p><strong>Space:</strong> O(n)</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Ad Slot handled by ui-extras -->
        
<div class="adsbygoogle-container" style="margin: 40px 0; text-align: center;">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6906580768177940" crossorigin="anonymous"></script>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-format="autorelaxed"
         data-ad-client="ca-pub-6906580768177940"
         data-ad-slot="9009736994"></ins>
    <script>
         (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
</div>
    </main>
    <script src="../assets/js/core/array-engine.js"></script>
    <script src="../assets/js/core/playback.js"></script>
    <script src="../assets/js/algos/mergesort.js"></script>
    <script>
        window.engine = new ArrayEngine('array-canvas');
        const playback = new Playback(() => window.algo.nextStep());
        window.ui = {
            updateStatus: (t) => { document.getElementById('explanation-text').innerText = t; },
            updateStats: (comp, swaps) => {
                document.getElementById('comp-count').innerText = comp;
                document.getElementById('swap-count').innerText = swaps;
            }
        };
        const ui = window.ui;
        window.algo = new MergeSortAlgo(window.engine, playback, ui);
        const algo = window.algo;
        function generateRandomArray() {
            playback.pause();
            const arr = Array.from({ length: 16 }, () => Math.floor(Math.random() * 90) + 10);
            window.engine.setArray(arr);
            window.algo.reset();
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Play';
        }
        document.getElementById('play-btn').onclick = () => {
            if (playback.isRunning) { playback.pause(); document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Play'; }
            else { playback.play(); document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i> Pause'; }
        };
        document.getElementById('reset-btn').onclick = () => { playback.reset(); algo.reset(); document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Play'; };
        window.onload = () => { generateRandomArray(); };
    </script>

    <script src='../assets/js/core/ui-extras.js'></script>
</body>

</html>
