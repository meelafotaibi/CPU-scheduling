<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disk Scheduling Visualizer | AlgoVisual Hub</title>
    <link rel="stylesheet" href="../assets/css/main.css">
    <link rel="stylesheet" href="../assets/css/responsive.css?v=mobile_fix_1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .visualizer-layout {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 30px;
            margin-top: 30px;
        }

        #disk-canvas {
            width: 100%;
            height: 400px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            border: 2px solid var(--glass-border);
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            margin-bottom: 15px;
            background: rgba(15, 23, 42, 0.6);
            color: var(--text);
        }
    </style>

    <link rel="icon" href="../assets/img/logo.png" type="image/png">
</head>

<body><canvas id="brain-canvas"></canvas>
    <nav>
        <div class="container nav-content">
            <a href="../index.html" class="logo">AlgoVisual Hub</a>
            <div class="nav-links">
                <a href="../index.html">Home</a>
                <a href="../os.html">Back to OS</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <header style="margin-top: 40px;">
            <span class="btn-primary"
                style="font-size: 0.8rem; padding: 5px 15px; border-radius: 20px; margin-bottom: 15px; display: inline-block;">Operating
                Systems</span>
            <h1>Disk Scheduling Visualizer</h1>
            <p>Visualize Seek Time optimization algorithms.</p>
        </header>

        <div class="visualizer-layout">
            <div class="main-panel">
                <div class="glass-card" id="visualizer-container" style="padding: 30px;">
                    <!-- Controls -->
                    <div class="controls" style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center; flex-wrap: wrap;">
                        <button class="btn btn-primary" id="play-btn"><i class="fas fa-play"></i> Run</button>
                        <button class="btn" id="reset-btn" style="border: 1px solid var(--accent); color: var(--accent); background: transparent;"><i class="fas fa-undo"></i> Reset</button>
                        <div style="display: flex; align-items: center; gap: 8px; margin-left: 10px;">
                            <span style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700;"><i class="fas fa-gauge-high"></i> Speed</span>
                            <input type="range" id="speed-slider" min="1" max="100" value="50" style="width: 80px; height: 6px; cursor: pointer; padding: 0; border: none; margin-bottom: 0;">
                        </div>
                        <button class="btn btn-secondary"
                            onclick="shareScreenshot('visualizer-container', 'Disk Scheduling')">📸 Share</button>
                    </div>

                    <canvas id="disk-canvas"></canvas>
                </div>
            </div>

            <div class="side-panel">
                <div class="glass-card" style="padding: 20px;">
                    <h3>Configuration</h3>
                    <div class="input-group">
                        <label>Algorithm</label>
                        <select id="algo-select"
                            style="width:100%; padding:8px; margin-bottom:15px; border-radius:6px;">
                            <option value="FCFS">FCFS</option>
                            <option value="SSTF">SSTF</option>
                            <option value="SCAN">SCAN</option>
                            <option value="C-SCAN">C-SCAN</option>
                            <option value="LOOK">LOOK</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>Initial Head Position</label>
                        <input type="number" id="head-input" value="50" min="0" max="199">
                    </div>
                    <div class="input-group">
                        <label>Request Queue (0-199)</label>
                        <input type="text" id="requests-input" value="82,170,43,140,24,16,190">
                    </div>
                </div>

                <div class="glass-card" style="padding: 20px; margin-top:20px;">
                    <h3>Performance</h3>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                        <span>Total Seek:</span>
                        <strong id="seek-count">0</strong>
                    </div>
                    <div id="status-text" style="font-size: 0.9rem; font-style: italic; color:#888;">
                        Ready.
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="../assets/js/core/disk-engine.js"></script>
    <script src="../assets/js/core/playback.js"></script>
    <script src="../assets/js/algos/disk-algo.js"></script>
    <script>
        window.engine = new DiskEngine('disk-canvas');

        const ui = {
            updateStatus: (t) => document.getElementById('status-text').innerText = t,
            updateStats: (seek, stepCount) => document.getElementById('seek-count').innerText = seek
        };

        const playback = new Playback(() => window.algo.nextStep());
        window.playback = playback;

        window.algo = new DiskAlgo(window.engine, playback, ui);

        document.getElementById('play-btn').onclick = () => {
            if (playback.isRunning) {
                playback.pause();
                document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Run';
                return;
            }
            if (window.algo.currentIndex === 0) {
                const algo = document.getElementById('algo-select').value;
                const head = parseInt(document.getElementById('head-input').value);
                const reqs = document.getElementById('requests-input').value.split(',').map(Number).filter(n => !isNaN(n));
                window.algo.init(algo, reqs, head);
            }
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-pause"></i> Pause';
            playback.play().then(() => {
                document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Run';
            });
        };

        document.getElementById('reset-btn').onclick = () => {
            playback.reset();
            window.algo.currentIndex = 0;
            window.engine.draw();
            document.getElementById('seek-count').innerText = '0';
            document.getElementById('status-text').innerText = 'Reset. Configure and run.';
            document.getElementById('play-btn').innerHTML = '<i class="fas fa-play"></i> Run';
        };

        const speedSlider = document.getElementById('speed-slider');
        speedSlider.oninput = (e) => { playback.setSpeed(parseInt(e.target.value)); };
        playback.setSpeed(parseInt(speedSlider.value));
    </script>
    <script src='../assets/js/core/ui-extras.js'></script>
<script src="../assets/js/brain-animation.js"></script></body>

</html>
